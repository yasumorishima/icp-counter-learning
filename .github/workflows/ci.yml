name: CI

# 鍵は一切使わない。ビルドが壊れていないかと、実ブラウザで動くかだけを見る。
# 本番への反映は scripts/deploy.sh を人が実行する（配備鍵は RPi5 から出さない）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      memo:
        description: 実行の意図
        required: false
        default: 手動確認

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # しょうぎの きまりは 画面が なくても 確かめられる。数え上げ（perft）が
      # 1 でも ずれたら 駒の うごきか 王手の 判定が こわれている。
      - name: しょうぎの きまりと そらの 計算を 検算
        run: |
          node tests/shogi-rules.test.mjs
          node tests/shogi-ai.test.mjs
          node tests/shogi-endings.test.mjs
          node tests/sky-astro.test.mjs
          node tests/sky-names.test.mjs
          node tests/i18n-keys.test.mjs

      # 自分の 実装を 自分で 採点しない。外の OSS（tsshogi・MIT）と 合法手を 全数 突き合わせる。
      - name: しょうぎの きまりを 外の OSS と 突き合わせ
        run: node tests/shogi-vs-oss.test.mjs

      - name: dfx を導入
        run: |
          DFXVM_INIT_YES=true sh -ci "$(curl -fsSL https://internetcomputer.org/install.sh)"
          echo "$HOME/.local/share/dfx/bin" >> "$GITHUB_PATH"

      - name: dfx の版を確認
        run: dfx --version

      - name: ローカル replica を起動
        run: |
          dfx start --clean --background
          for i in $(seq 1 30); do
            if dfx ping >/dev/null 2>&1; then echo "replica ready"; exit 0; fi
            sleep 2
          done
          echo "replica did not become ready" >&2
          exit 1

      - name: バックエンドを配置して宣言を生成
        run: |
          dfx deploy todo_app_backend
          dfx generate todo_app_backend

      # npm start（webpack serve）は本番のビルドと別の設定（devServer）を読むので、
      # 本番ビルドが緑でも壊れていることがある。実際に proxy の書き方が dev-server 5 で
      # 通らなくなったまま 3 か月 起動しなかった。起動させ、ページと /api の中継を叩く。
      # 中継は「dev-server 経由」と「replica 直」で状態コードと Content-Type が同じかで見る
      # （replica は application/cbor。中継が無いと dev-server 自身の 404 が text/html で返る）。
      # 中身のハッシュは比べない。CI の dfx は版を固定しておらず、応答に高さなどが入ると揺れる。
      # CI では出力が色つきになり「compiled <色>successfully」と割れるので、色を消してから読む。
      - name: 開発サーバーが起動して replica へ中継できるか
        run: |
          npx webpack serve --mode development --env development --port 18080 --no-color > serve.log 2>&1 &
          pid=$!
          plain() { sed -E 's/\x1b\[[0-9;]*m//g' serve.log; }
          up=0
          for i in $(seq 1 60); do
            if plain | grep -qE "compiled (successfully|with)"; then up=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          fail() { echo "$1" >&2; plain >&2; kill "$pid" 2>/dev/null || true; exit 1; }
          test "$up" = 1 || fail "開発サーバーが起動しなかった"
          ! plain | grep -qE "compiled with [0-9]+ errors?" || fail "開発サーバーのビルドにエラーがある"
          page=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 http://127.0.0.1:18080/ || true)
          via=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 http://127.0.0.1:18080/api/v2/status || true)
          direct=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 http://127.0.0.1:4943/api/v2/status || true)
          kill "$pid" 2>/dev/null || true
          echo "GET / -> $page / /api/v2/status: dev-server [$via] / replica [$direct]"
          test "$page" = 200 || fail "ページが 200 でない"
          case "$direct" in "200 application/cbor"*) ;; *) fail "replica 直の /api/v2/status が 200 の CBOR でない（検査の前提が崩れている）";; esac
          test "$via" = "$direct" || fail "dev-server が /api を replica へ中継していない"

      # 本番と同じ条件（最小化あり・network=ic）で作った成果物を検証する。
      # HTML 圧縮が type="text" を削るなど、本番ビルドでしか出ない不具合をここで捕まえる。
      - name: 本番向けビルドを検証
        run: |
          rm -rf dist
          DFX_NETWORK=ic CANISTER_ID_TODO_APP_BACKEND=ifoqp-6iaaa-aaaaj-qnnrq-cai npx webpack --mode production
          tags=$(grep -c '<script' dist/todo_app_frontend/index.html)
          test "$tags" -eq 1 || { echo "script タグが ${tags} 個。1 個であるべき" >&2; exit 1; }
          grep -q 'ic0.app' dist/todo_app_frontend/index.js || { echo "バンドルが ic0.app を向いていない" >&2; exit 1; }
          grep -q 'ifoqp-6iaaa-aaaaj-qnnrq-cai' dist/todo_app_frontend/index.js || { echo "backend canister id が無い" >&2; exit 1; }
          echo "OK: script タグ 1 個 / ic0.app / backend canister id"

      # いまの画面は .ts を 1 本も持たないので、上の本番ビルドでは ts-loader の規則が一度も走らない。
      # そのため TypeScript のメジャー更新で ts-loader の経路が壊れても配布物は変わらず緑になる
      # （2026-09-14 実測＝TS 7.0.2 は JS API が無く ts-loader が TypeError、TS 6.0.3 は
      # tsconfig の moduleResolution=node が TS5107 で止まる）。小さな .ts を通して確かめる。
      - name: ts-loader が .ts を通せるか
        run: |
          probe="$RUNNER_TEMP/tsprobe"
          mkdir -p "$probe"
          printf 'const n: number = 41 + 1;\nexport const probe = `probe-${n}`;\nconsole.log(probe);\n' > probe-ts-loader.ts
          DFX_NETWORK=ic CANISTER_ID_TODO_APP_BACKEND=ifoqp-6iaaa-aaaaj-qnnrq-cai \
            npx webpack --mode production --no-color --entry-reset --entry ./probe-ts-loader.ts --output-path "$probe" > "$probe/build.log" 2>&1 \
            || { cat "$probe/build.log" >&2; rm -f probe-ts-loader.ts; echo "ts-loader で .ts をビルドできない" >&2; exit 1; }
          rm -f probe-ts-loader.ts
          grep -q 'probe-42' "$probe/index.js" || { cat "$probe/build.log" >&2; echo "出力に型を外した結果（probe-42）が無い" >&2; exit 1; }
          echo "OK: typescript $(node -p 'require("typescript").version') で .ts を通せた"

      - name: ローカル replica 向けにビルドして配置
        run: |
          rm -rf dist
          npx webpack --mode production
          dfx deploy todo_app_frontend

      - name: ブラウザを用意
        run: |
          npm install --no-save playwright@1 jsqr@1
          npx playwright install --with-deps chromium

      - name: 実ブラウザで通しテスト
        run: |
          url="http://$(dfx canister id todo_app_frontend).localhost:4943/"
          echo "target: $url"
          node e2e/e2e.mjs "$url"

      - name: 失敗したときだけ画面を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: e2e-shots/
          retention-days: 5
          if-no-files-found: ignore
