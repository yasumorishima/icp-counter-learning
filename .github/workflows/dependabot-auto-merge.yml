name: Dependabot auto-merge

# CI が緑になった Dependabot の PR を、パッチとマイナーに限って自動で取り込む。
#
# pull_request ではなく workflow_run を引き金にしているのは 2 つの理由から。
#   - Dependabot の PR に渡る GITHUB_TOKEN は読み取り専用で、そもそも merge できない
#   - workflow_run は「CI が終わったこと」そのものが引き金なので、緑を待つ処理を
#     自分で書かずに済む（待ち合わせを書くとそこが壊れる）
# workflow_run で走るのは main に置かれたこのファイルなので、PR 側で中身を
# 書き換えても差し替わらない。checkout は一切しない。
#
# 判定は fail-closed。Dependabot の PR だと確認できない・版が読み取れない・
# CI が見たコミットと先端が違う、のいずれでも「何もしない」で終える。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # 取り込んだ後の main を確かめるために CI を手動起動する。GITHUB_TOKEN による
  # push はワークフローを起こさないが、workflow_dispatch は明文の例外。
  actions: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 緑になった Dependabot の PR を取り込む
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "枝が $HEAD_REPO ＝ fork。何もしない"
            exit 0
          fi

          case "$BRANCH" in
            dependabot/*) ;;
            *) echo "$BRANCH は Dependabot の枝ではない。何もしない"; exit 0 ;;
          esac

          # 🔴 --head は fork の PR も返す。同じ枝名の PR を fork に立てられると
          # そちらが先頭に来て本物が素通しされるので、同一リポジトリのものだけに絞る。
          # gh は GitHub App の作者を版によって app/dependabot とも
          # dependabot[bot] とも返す（このリポジトリの PR #18 は app/dependabot）。
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                 --json number,author,headRefOid,title,body,isCrossRepository \
                 --jq '[ .[]
                         | select(.isCrossRepository | not)
                         | select(.author.login == "app/dependabot"
                                  or .author.login == "dependabot[bot]") ][0] // empty')
          if [ -z "$pr" ]; then
            echo "$BRANCH に Dependabot の開いた PR が無い。何もしない"
            exit 0
          fi

          number=$(jq -r '.number' <<<"$pr")
          head=$(jq -r '.headRefOid' <<<"$pr")
          jq -r '.body' <<<"$pr" > pr-body.txt

          # CI が見たコミットと今の先端が違えば、その緑は今の中身の緑ではない
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$number の先端は $head で、CI が見た $HEAD_SHA と違う。何もしない"
            exit 0
          fi

          # 版は本文から読む。Dependabot は依存ごとに 1 行ずつ要約を書く。
          verdict=$(python3 - <<'PY'
          import pathlib
          import re

          body = pathlib.Path("pr-body.txt").read_text(encoding="utf-8", errors="replace")

          # 🔴 本文全体を見てはいけない：取り込んだ変更履歴の引用にも
          # 「bump postcss from 8.5.15 to 8.5.18」のような行が現れる（PR #18 で実測）。
          claims = [l for l in body.splitlines() if re.match(r"^(?:Bumps|Updates) ", l)]
          # group PR の見出し（「Bumps the actions group with 6 updates:」）は版を持たない
          claims = [l for l in claims
                    if not re.match(r"^Bumps the .+ group with \d+ update", l)]

          pairs = []
          for line in claims:
              m = re.search(r"\bfrom v?(\d+(?:\.\d+)*) to v?(\d+(?:\.\d+)*)", line)
              if m:
                  pairs.append(m.groups())

          # 🔴 旧版を書かない要約行が実在する（「Updates `stylelint` to 17.15.0」）。
          # 拾えた組の数が要約行の数に足りなければ、読めていない依存がある。
          if not pairs or len(pairs) != len(claims):
              print("unreadable")
          elif all(a.split(".")[0] == b.split(".")[0] for a, b in pairs):
              print("ok %d" % len(pairs))
          else:
              print("major")
          PY
          )
          echo "版の読み取り: $verdict"

          case "$verdict" in
            ok\ *)
              # --match-head-commit は GitHub 側で先端を照合させる。判定してから
              # merge するまでの間に rebase が入っても、未検証のコミットは入らない。
              gh pr merge "$number" --repo "$REPO" --squash --delete-branch \
                --match-head-commit "$HEAD_SHA"
              echo "PR #$number を取り込んだ"
              # 取り込み後の main は誰も見ていない（GITHUB_TOKEN の push は CI を
              # 起こさない）。複数 PR が同じ base で緑になった合成結果を確かめる。
              gh workflow run ci.yml --repo "$REPO" --ref main \
                -f memo="Dependabot #$number 取り込み後の main を確かめる"
              ;;
            major)
              echo "メジャー更新を含むので自動では入れない。PR #$number は開いたままにする"
              ;;
            *)
              echo "本文から版を読み取れなかった。PR #$number は開いたままにする"
              ;;
          esac
