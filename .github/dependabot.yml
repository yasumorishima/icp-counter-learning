# 依存の更新を待たずに毎週こちらから取りに行くための設定。
#
# 脆弱性が見つかったときの自動 PR（Dependabot security updates）はリポジトリ側の
# 設定で既に有効になっている。ここで宣言するのは「脆弱性が出る前に古くしておかない」
# ための定期更新のほうで、両方あって初めて警告メールが届く前に片が付く。
#
# 取り込みは .github/workflows/dependabot-auto-merge.yml が CI の緑を見て行う。
# メジャー更新だけは自動で入らない（同ファイルの判定を参照）。
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 🔴 @dfinity/* は互いに peer dependency で縛り合っている。1 つだけ上げると
      # `npm ci` が ERESOLVE で落ちる（2026-09-08 実測＝candid だけ 1.4.0→3.4.3 にした
      # PR #28 は agent@1.4.0 の peer `candid@^1.4.0` と衝突）。メジャーも含めて
      # 家族ごと動かす。上から順に当たるので npm の総称より前に置く。
      dfinity:
        patterns: ["@dfinity/*"]

      # 1 件 1 PR にすると CI（ビルド＋検算＋E2E）が件数ぶん回る。
      # パッチとマイナーは 1 本にまとめ、メジャーはまとめずに個別で立てさせる
      # ＝自動取り込みの対象から外れて目に残る。
      npm:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      # 🔴 TypeScript 7 は入口（package.json の "."）が lib/version.cjs だけで、コンパイラの
      # JS API を持たない。ts-loader はその API を呼ぶので、.ts を 1 つでも通すと
      # 「Cannot read properties of undefined (reading 'fileExists')」で落ちる
      # （2026-09-14 実測・TS 5.8 では同じ probe.ts が通る。PR #35 を閉じた理由）。
      # いまは .ts が 0 本で配布物は変わらないが、ts-loader の経路を黙って壊すので止める。
      # ts-loader が TypeScript 7 に対応したら外す。
      # ⚠️ ignore はセキュリティ更新にも効く（GitHub の docs）。typescript は開発時だけの
      # 依存で配布物に入らないので受け入れる。7 系でしか直らない脆弱性が出たら見直す。
      - dependency-name: typescript
        versions: [">=7"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 🔴 update-types を省くと全 SemVer が 1 本に入る。Actions はメジャーが
      # 頻繁に上がる（実物 lukelowry.github.io#3 は checkout 4→7 を含む 6 件が 1 PR）ので、
      # 省くとメジャー 1 件でパッチまで道連れに手動へ落ちる。
      actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"
