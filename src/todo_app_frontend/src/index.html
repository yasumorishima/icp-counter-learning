<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8f3">
    <meta name="description" content="小学 1〜6年の さんすうドリル。広告なし、登録なし。記録は端末の中だけに残ります。">
    <meta property="og:title" content="さんすうドリル 1〜6年">
    <meta property="og:description" content="広告なし、登録なし。記録は端末の中だけ。">
    <meta property="og:type" content="website">
    <title>さんすうドリル 1〜6年</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2338bdf8'/%3E%3Cstop offset='.34' stop-color='%23a78bfa'/%3E%3Cstop offset='.68' stop-color='%23f472b6'/%3E%3Cstop offset='1' stop-color='%23fbbf24'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%23FFFFFF'/%3E%3Cpath d='M7 16.5 13 22l12-12' stroke='url(%23g)' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="wrap">
        <header class="site-header">
            <a class="brand" href="#/">
                <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <defs>
                        <linearGradient id="ic" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#38bdf8"/>
                            <stop offset="0.36" stop-color="#a78bfa"/>
                            <stop offset="0.68" stop-color="#f472b6"/>
                            <stop offset="1" stop-color="#fbbf24"/>
                        </linearGradient>
                    </defs>
                    <path d="M7 16.5 13 22l12-12" stroke="url(#ic)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-text">さんすうドリル</span>
            </a>
            <div class="header-tools">
                <button type="button" id="size-toggle" class="icon-btn size-btn" aria-label="もじの おおきさ">
                    <span class="size-small">あ</span><span class="size-large">あ</span>
                </button>
                <button type="button" id="theme-toggle" class="icon-btn" aria-label="theme">
                    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
                    </svg>
                    <svg class="i-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
                    </svg>
                </button>
                <label class="lang">
                    <span class="sr-only">Language</span>
                    <select id="lang-select"></select>
                </label>
            </div>
        </header>

        <main>
            <!-- ============ ドリル（トップ） ============ -->
            <section id="view-drill" class="view">
                <div class="drill-top">
                    <button type="button" id="who-open" class="who">
                        <span id="who-face" class="who-face">🐻</span>
                        <span class="who-text">
                            <b id="who-name">はじめまして</b>
                            <span id="who-streak" class="who-streak"></span>
                        </span>
                        <span class="who-caret">つかう人を かえる ▼</span>
                    </button>
                    <div class="who-right">
                        <span class="star-chip"><span class="star-mark">★</span><b id="who-stars">0</b></span>
                        <a class="btn-ghost" href="#/kiroku">きろく</a>
                    </div>
                </div>

                <div id="who-panel" class="who-panel is-hidden"></div>

                <div id="who-empty" class="panel panel-center is-hidden">
                    <h2 class="panel-title">なまえを きめよう</h2>
                    <p class="lede">この きろくは この たんまつの なかだけに のこります。</p>
                    <div class="face-row" id="face-row"></div>
                    <input id="who-input" type="text" maxlength="12" placeholder="なまえ">
                    <button type="button" id="who-add" class="cta"><span class="cta-label">はじめる</span></button>
                </div>

                <div id="drill-main">
                    <div id="weak-row" class="weak-row is-hidden"></div>
                    <div class="grade-tabs" id="grade-tabs"></div>
                    <div class="unit-grid" id="unit-grid"></div>
                </div>
            </section>

            <!-- ============ 問題 ============ -->
            <section id="view-quiz" class="view is-hidden">
                <div class="quiz-bar">
                    <button type="button" id="quiz-quit" class="btn-ghost">やめる</button>
                    <div id="quiz-dots" class="quiz-dots"></div>
                    <span id="quiz-count" class="quiz-count"></span>
                </div>

                <div class="quiz-card">
                    <span id="quiz-unit" class="quiz-unit"></span>
                    <p id="quiz-text" class="quiz-text"></p>
                    <canvas id="quiz-clock" class="quiz-clock is-hidden" width="190" height="190" aria-hidden="true"></canvas>
                    <div id="quiz-answer" class="quiz-answer">?</div>
                    <p id="quiz-hint" class="quiz-hint"></p>
                    <p id="quiz-feedback" class="quiz-feedback" role="status"></p>
                </div>

                <div id="quiz-choices" class="quiz-choices is-hidden"></div>
                <div id="quiz-keypad" class="keypad"></div>
            </section>

            <!-- ============ けっか ============ -->
            <section id="view-result" class="view is-hidden">
                <div class="panel panel-center">
                    <div id="result-face" class="result-face">🎉</div>
                    <h2 id="result-title" class="panel-title"></h2>
                    <p id="result-score" class="result-score"></p>
                    <p id="result-note" class="lede"></p>
                    <div class="result-actions">
                        <button type="button" id="result-again" class="cta"><span class="cta-label">もういちど</span></button>
                        <a class="btn-ghost" href="#/">ほかの もんだい</a>
                    </div>
                </div>
            </section>

            <!-- ============ きろく ============ -->
            <section id="view-kiroku" class="view is-hidden">
                <div class="panel">
                    <h2 class="panel-title">きろく</h2>
                    <p class="lede">きろくは この たんまつの なかだけに あります。ほかへは 送られません。</p>
                    <div id="kiroku-people" class="people"></div>
                    <div id="kiroku-stats" class="kiroku-stats"></div>
                    <h3 class="support-sub">たんまつを かえるとき</h3>
                    <div class="share-row">
                        <button type="button" id="kiroku-export" class="btn-ghost">かきだす</button>
                        <button type="button" id="kiroku-import" class="btn-ghost">よみこむ</button>
                        <input id="kiroku-file" type="file" accept="application/json" class="is-hidden">
                    </div>
                    <p id="kiroku-status" class="status" role="status"></p>
                    <p><a class="btn-ghost" href="#/">もどる</a></p>
                </div>
            </section>



            <!-- ============ 支援 ============ -->
            <section id="view-support" class="view is-hidden">
                <div class="panel">
                    <h2 class="panel-title" data-t="supportHeading"></h2>
                    <p class="support-intro" data-t="supportIntro"></p>

                    <div class="fuel">
                        <span class="fuel-label" data-t="fuelHeading"></span>
                        <b id="fuel-main" class="fuel-main">—</b>
                        <span id="fuel-detail" class="fuel-detail"></span>
                        <div class="fuel-bar"><span id="fuel-fill" class="fuel-fill"></span></div>
                    </div>

                    <details class="support-more">
                        <summary>くわしい人むけ</summary>
                    <h3 class="support-sub" data-t="supportHow"></h3>
                    <p class="support-text" data-t="supportHow1"></p>

                    <p class="id-label" data-t="backendIdLabel"></p>
                    <div class="share-row">
                        <input id="backend-id" type="text" readonly>
                        <button type="button" id="copy-backend" class="btn-ghost" data-t="copy"></button>
                    </div>
                    <p class="id-label" data-t="frontendIdLabel"></p>
                    <div class="share-row">
                        <input id="frontend-id" type="text" readonly>
                        <button type="button" id="copy-frontend" class="btn-ghost" data-t="copy"></button>
                    </div>

                    <p class="support-note" data-t="noIcpNote"></p>

                    <h3 class="support-sub" data-t="waysHeading"></h3>
                    <ul class="ways">
                        <li><a href="https://nns.ic0.app/" target="_blank" rel="noopener noreferrer" data-t="wayNns"></a></li>
                        <li><a href="https://www.icptopup.com/" target="_blank" rel="noopener noreferrer" data-t="wayTopup"></a></li>
                        <li><a href="https://cycleops.dev/" target="_blank" rel="noopener noreferrer" data-t="wayCycleops"></a></li>
                        <li><a href="https://app.icpswap.com/" target="_blank" rel="noopener noreferrer" data-t="wayDex"></a></li>
                    </ul>

                    <p class="support-text" data-t="supportHow2"></p>
                    <pre class="code" id="wallet-cmd"></pre>
                    </details>

                    <p class="support-thanks" data-t="supportThanks"></p>
                    <p><a class="btn-ghost" href="#/" data-t="backHome"></a></p>
                </div>
            </section>

        </main>

        <footer class="site-footer">
            <p>
                <a href="#/support" data-t="supportNav"></a>
            </p>
            <p class="legacy">
                <button type="button" id="legacy-counter" class="legacy-counter" title="">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5 4.8 13.3a4.6 4.6 0 0 1 6.5-6.5l.7.7.7-.7a4.6 4.6 0 0 1 6.5 6.5Z"/></svg><span id="legacy-count">—</span>
                </button>
            </p>
        </footer>
    </div>
</body>
</html>
